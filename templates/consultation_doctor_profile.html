{% extends "consultation_base.html" %}
{% block title %}Doctor Profile | JHIMS Consultation{% endblock %}
{% block content %}
<section class="section">
  <div class="shell">
    <div class="card">
      <h1 class="page-title">Doctor Profile</h1>
      <p class="subtitle">Complete and professional profiles build trust and improve bookings.</p>
      <form method="post" style="margin-top:16px;" class="form-grid">
        <div>
          <label>Full Name</label>
          <input class="input" name="full_name" value="{{ doctor.full_name }}" required>
        </div>
        <div>
          <label>Phone</label>
          <input class="input" name="phone" value="{{ doctor.phone }}" required>
        </div>
        <div>
          <label>Specialty</label>
          <select class="input" name="specialty" required>
            {% for item in specialties %}
              <option value="{{ item }}" {% if doctor.specialty == item %}selected{% endif %}>{{ item }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label>Meeting Provider</label>
          <input class="input" name="meeting_provider" value="{{ doctor.meeting_provider or '' }}" placeholder="Google Meet / Zoom / WhatsApp">
        </div>
        <div>
          <label>Years of Experience</label>
          <input class="input" type="number" min="0" name="years_experience" value="{{ doctor.years_experience or 0 }}">
        </div>
        <div>
          <label>Consultation Fee (GHS)</label>
          <input class="input" type="number" min="0" step="0.01" name="consultation_fee" value="{{ doctor.consultation_fee or 0 }}">
        </div>
        <div>
          <label>Available Days</label>
          <input class="input" name="available_days" value="{{ doctor.available_days or '' }}" placeholder="Mon-Fri, Sat morning">
        </div>
        <div>
          <label>Available Hours</label>
          <input class="input" name="available_hours" value="{{ doctor.available_hours or '' }}" placeholder="08:00 - 16:00">
        </div>
        <div class="form-wide">
          <label>Profile Bio</label>
          <textarea class="input" name="bio" rows="5">{{ doctor.bio or '' }}</textarea>
        </div>
        <div class="form-wide badge-row">
          <button class="btn btn-primary" type="submit">Save Profile</button>
          <a class="btn btn-soft" href="{{ url_for('consult_doctor_dashboard') }}">Back to Dashboard</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
